[package]
name = "ovgent-router"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ovgent-router"
path = "src/main.rs"

[dependencies]
osmpbfreader = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
